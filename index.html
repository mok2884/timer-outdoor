<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 数字は自作の7セグ(外部フォントなし)。文字用フォントは、届くまで画面を止めない読み込み方 -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d16">
<style>
body{margin:0;font-family:sans-serif;background:#080d16;color:#e2e8f0;display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;overflow:hidden;overscroll-behavior:none}
.container{text-align:center}
/* 時間の枠。中の比率は cm.html と同じ。font-size で枠全体の大きさが決まる(横幅は前の枠と同じ846px) */
#display{display:flex;align-items:center;justify-content:center;font-size:167.5px;border:4px solid #d9d9d9;border-radius:.114em;padding:.3em .42em;background:#000;box-shadow:0 0 .0732em rgba(217,217,217,.8);margin-bottom:20px}
#display svg{display:block;height:.7485em;width:auto;overflow:visible}
button{padding:15px;font-size:18px;border:none;border-radius:8px;cursor:pointer;background:#334155;color:#fff}
button:active{transform:scale(.95)}
#status{font-size:14px;font-weight:bold;padding:5px 10px;border-radius:5px;display:inline-block;margin-top:10px}
.ok{color:#22c55e;border:1px solid #22c55e}.wait{color:#eab308;border:1px solid #eab308}.ng{color:#ef4444;border:1px solid #ef4444}
.s .ok,.s .wait,.s .ng,.c .ok,.c .wait,.c .ng{color:#64748b;border:1px solid #334155}
#lblRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%}
#slaveLabel{font-size:30px;font-weight:700;text-align:center;font-family:Roboto,sans-serif}
.s #slaveLabel,.c #slaveLabel{font-size:34px;font-weight:900}
.rl{background:#334155;border:1px solid #475569;color:#cbd5e1;border-radius:4px;padding:4px 8px;font-size:12px;margin-bottom:5px}
.m .rl{display:none}
#topRow{width:100%;display:flex;justify-content:space-between;align-items:flex-start}
#topRow .rl{margin-left:auto}
#pinBtn{display:none;background:#334155;border:1px solid #475569;color:#cbd5e1;border-radius:4px;padding:4px 8px;margin-bottom:5px;line-height:0}
#pinBtn.on{background:#475569;color:#fff}
#pinBtn svg{width:30px;height:30px}

/* 親機の枠(横幅は前の枠と同じ470px) */
.m #display{font-size:92.7px;border-width:3px}
.s #dg,.c #dg{transform-origin:center;display:flex;flex-direction:column;align-items:center}
.c #display{margin:0 auto 20px}
#cueInfo{display:none;width:94%;height:78px;margin:10px auto 0;font-family:Roboto,sans-serif;font-weight:900}
.c #cueInfo{display:block}
#cueLabel{text-align:left;font-size:38px;font-weight:600;margin-bottom:4px}
#cueTimeRow{display:flex;justify-content:space-between;align-items:baseline}
#cueTargetTime{font-size:34px;font-weight:600}
#cueRemain{font-size:50px;font-weight:700}
#ui{display:none}.m #ui{display:block}
#ctl{position:fixed;inset:0;background:rgba(15,23,42,.65);display:none;justify-content:center;align-items:center;z-index:9998;text-align:center;color:#fff;font-weight:bold;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#ctlBtn{position:relative;overflow:hidden;border:4px solid #fff;border-radius:16px;padding:22px 40px;font-size:40px;line-height:1}
#ctlFill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.4)}
#ctlBtn span{position:relative}
#inputPreview{font-size:32px;color:#94a3b8;margin-bottom:10px;font-family:monospace}
.mainRow{display:flex;gap:16px;align-items:flex-start}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:280px}
.keypad button{font-size:24px;font-weight:900;height:80px}
.act{background:#475569}
.kh{display:block;font-size:14px;font-weight:600;opacity:.55;margin-top:5px;line-height:1;letter-spacing:.02em}
@media (hover:none){.kh{display:none}}
.set{background:#0f766e;font-size:19px!important;padding:5px 4px!important;line-height:1.05}
.set .kh{font-size:12px;margin-top:3px}
.rp{display:flex;flex-direction:column;gap:10px}
.rz{height:80px;background:#556577;font-weight:900}
.go{height:225px;background:#f8f8f4;color:#000;font-weight:900}
.disabled{background:#334155!important;color:#94a3b8!important;cursor:not-allowed;opacity:.6}
#cueMasterInfo{width:94%;height:40px;margin:6px auto 0;display:flex;align-items:baseline;font-family:Roboto,sans-serif;font-weight:900;gap:40px}
#cml{font-size:20px;font-weight:700}#cmt{font-size:26px;font-weight:700}
#cmr{margin-left:auto;font-size:20px;font-weight:300;color:#64748B}
.cb{display:grid;grid-template-columns:repeat(3,86.67px) 100px 70px;gap:10px;margin-top:6px}
.cb button{height:50px;padding:4px;font-size:18px;font-weight:900}
.cb .clr{font-size:15px;font-weight:700}
#mon{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:8px;padding-right:4px;font-family:monospace;font-size:16px}
#al{color:#555;font-weight:900;margin-right:12px}
#sn{color:#666;cursor:pointer}
.m #status{margin-top:0}
#dbg{color:#475569;font-size:12px;margin-top:4px;font-family:monospace}
#dbg span+span{margin-left:10px}
#err{color:#94a3b8;font-size:14px;margin-top:6px;font-family:monospace}
.s #err,.c #err{display:none}
.m #dbg,.m #err{margin-top:0}
.m #dbg{color:#64748b}
#qrBtn{justify-self:end;padding:7px 14px;font-size:15px;background:#475569;color:#fff;border-radius:8px}
#qrOv{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center;z-index:9000}
#qrOv img{max-width:80vmin;max-height:80vmin;background:#fff;padding:16px;border-radius:12px;color:#000}
*{touch-action:manipulation}
/* スマホで、ページの横幅をブラウザが勝手に広げないようにする(左端が切れるのを防ぐ) */
html{overflow:hidden}
</style>
</head>
<body>
<div id="tap" style="position:fixed;inset:0;background:rgba(15,23,42,.8);display:none;justify-content:center;align-items:center;z-index:9999;cursor:pointer"><div style="color:#fff;font-size:30px;font-weight:bold;text-align:center">TAP HERE</div></div>

<div class="container">
<div id="dg">
<div id="topRow"><button id="pinBtn" onclick="pinToggle()" aria-label="PIN"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6z"/><path d="M12 14v7"/></svg></button><button class="rl" onclick="location.reload()">RELOAD</button></div>

<div class="mainRow">
<div class="keypad">
<button onclick="press(1)">1</button><button onclick="press(2)">2</button><button onclick="press(3)">3</button>

</div>
<div id="cueMasterInfo"><span id="cml">--</span><span id="cmt">--:--</span><span id="cmr">--:--</span></div>
<div class="cb">
<button onclick="setCue('CM入り','#20E0D0')">CM入</button>
<!-- 曲入【保留中】復活するときは、次の1行(空き)を消して、その下のコメントの中のボタンを元に戻す -->
<span></span>

</div>
<div id="mon"></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getDatabase,ref,onValue,set,remove,serverTimestamp,goOffline,goOnline}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
const db=getDatabase(initializeApp({
  apiKey:"AIzaSyBxjNwnUhrCtYa0Tlr0mnbRm3-3i7CZFX0",
  authDomain:"broadcast-timer-da325.firebaseapp.com",
  databaseURL:"https://broadcast-timer-da325-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"broadcast-timer-da325",
  storageBucket:"broadcast-timer-da325.firebasestorage.app",
  messagingSenderId:"937331375256",
  appId:"1:937331375256:web:4d18dfd3c89744057d64ed"
}));
const P=new URLSearchParams(location.search);
const ROOM='rooms/'+(P.get('room')||'tmr-8f3kQ2xZ7vLm').replace(/[.#$\[\]\/]/g,'');
let did;try{did=localStorage.getItem('did');if(!did){did=Math.random().toString(36).slice(2,10);localStorage.setItem('did',did)}}catch(e){did=Math.random().toString(36).slice(2,10)}
const R=p=>ref(db,ROOM+'/'+p);
let pipWin=null,pipBox=null;
const $=id=>document.getElementById(id)||(pipWin&&pipWin.document.getElementById(id));
const q=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const fmt=t=>p2(Math.floor(t/3600))+':'+p2(Math.floor(t%3600/60))+':'+p2(t%60);
const mmss=t=>p2(Math.floor(t%3600/60))+':'+p2(t%60);
const hms=s=>{s=s.padStart(6,'0');return s.slice(0,2)*3600+s.slice(2,4)*60+s.slice(4,6)*1};

/* ===== 7セグの数字(自作。外部フォントは使わない) =====
   見た目の調整は、この SEG の数字を変えるだけでできる */
const SEG={
  h:100,       /* 数字の縦の長さ(横幅は56のまま) */
  T:9.5,       /* 線の太さ */
  cut:4,    /* 縦線の外側の角を落とす量 */
  gap:31,       /* 数字の間(2桁の中) */
  pg:94,      /* 2桁ごとの間(コロンのある所) */
  sk:6,       /* 傾き(度) */
  G:2.6,      /* 棒と棒のすき間 */
  mu:0,       /* むら(%)。線ごとの明るさの差(0で全部同じ明るさ) */
  dEdge:'#f00f0f',dMid:'#ff5b4d', /* 数字の色(線の端/真ん中) */
  dW:25,      /* 光る幅(%)。真ん中の明るい部分の広さ */
  cr:10.5,       /* コロンの大きさ */
  cs:54,      /* コロンの縦の間 */
  cy:3,       /* コロンの上下の位置(マイナスで上へ) */
  cCol:'#b1072a', /* コロンの色 */
  cHi:'#d14452',  /* コロンの玉の真ん中 */
  cLo:'#78051c',  /* コロンの玉のふち */
  cGlow:6.25,  /* コロンのにじみの広がり(ぼかしは使わない) */
  cHalo:.5,  /* コロンのにじみの濃さ(0でにじみなし) */
  cOff:.2     /* コロンが消えているときの濃さ */
};
function seg7(box){
  const NS='http://www.w3.org/2000/svg',W=56,H=SEG.h,G=SEG.G,M=H/2,T=SEG.T;
  /* 縦線は外側の角を少し斜めに落とし、横線は台形。縦線と横線は1本の直線の切れ目で合わさる */
  const P=SEG.cut,D=G*Math.hypot(T-P,T)/T,fx=q=>q.map(([x,y])=>[W-x,y]),fy=q=>q.map(([x,y])=>[x,H-y]);
  const F=[[0,P],[P,0],[T,T],[T,M-T/2-G],[0,M-G]],A=[[P+D,0],[W-P-D,0],[W-T-D,T],[T+D,T]];
  const S={a:A,d:fy(A),f:F,b:fx(F),e:fy(F),c:fx(fy(F)),
    g:[[G,M],[T+G,M-T/2],[W-T-G,M-T/2],[W-G,M],[W-T-G,M+T/2],[T+G,M+T/2]]};
  const MAP={0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgedc',7:'abc',8:'abcdefg',9:'abcdfg'};
  const xs=[],cx=[];let x=0;
  for(let i=0;i<3;i++){xs.push(x,x+W+SEG.gap);x+=W*2+SEG.gap;if(i<2){cx.push(x+SEG.pg/2);x+=SEG.pg}}
  const off=Math.tan(SEG.sk*Math.PI/180)*H;
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','-6 -8 '+(x+off+12)+' '+(H+16));svg.setAttribute('aria-hidden','true');
  const p1=(0.5-SEG.dW/200).toFixed(3),p2=(0.5+SEG.dW/200).toFixed(3);
  const grad=(id,v)=>'<linearGradient id="'+id+'" x1="0" y1="0" x2="'+(v?0:1)+'" y2="'+(v?1:0)+'"><stop offset="0" stop-color="'+SEG.dEdge+'"/><stop offset="'+p1+'" stop-color="'+SEG.dMid+'"/><stop offset="'+p2+'" stop-color="'+SEG.dMid+'"/><stop offset="1" stop-color="'+SEG.dEdge+'"/></linearGradient>';
  svg.innerHTML='<defs>'+grad('sgH',0)+grad('sgV',1)+
    '<radialGradient id="sgD" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="'+SEG.cHi+'"/><stop offset=".55" stop-color="'+SEG.cCol+'"/><stop offset="1" stop-color="'+SEG.cLo+'"/></radialGradient>'+
    '<radialGradient id="sgR"><stop offset="0" stop-color="'+SEG.cCol+'" stop-opacity="'+SEG.cHalo+'"/><stop offset=".45" stop-color="'+SEG.cCol+'" stop-opacity="'+(SEG.cHalo*.45)+'"/><stop offset="1" stop-color="'+SEG.cCol+'" stop-opacity="0"/></radialGradient></defs>';
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const digs=xs.map(x0=>{
    const g=document.createElementNS(NS,'g');
    g.setAttribute('transform','translate('+(x0+off)+',0) skewX(-'+SEG.sk+')');
    const d={};
    Object.entries(S).forEach(([k,pts])=>{const q=document.createElementNS(NS,'polygon');q.setAttribute('points',pts.map(z=>z.join(',')).join(' '));q.setAttribute('fill','url(#'+('agd'.includes(k)?'sgH':'sgV')+')');q.style.opacity=0;d[k]=[q,(1-SEG.mu/100+rnd()*SEG.mu/100).toFixed(3)];g.appendChild(q)});
    svg.appendChild(g);return d;
  });
  const cols=cx.map(c0=>{
    const g=document.createElementNS(NS,'g');
    [M+SEG.cy-SEG.cs/2,M+SEG.cy+SEG.cs/2].forEach(y=>{
      const h=document.createElementNS(NS,'circle');h.setAttribute('cx',c0+off/2);h.setAttribute('cy',y);h.setAttribute('r',SEG.cr+SEG.cGlow*2.4);h.setAttribute('fill','url(#sgR)');g.appendChild(h);
      const c=document.createElementNS(NS,'circle');c.setAttribute('cx',c0+off/2);c.setAttribute('cy',y);c.setAttribute('r',SEG.cr);c.setAttribute('fill','url(#sgD)');g.appendChild(c)});
    svg.appendChild(g);return g;
  });
  box.textContent='';box.appendChild(svg);
  let last='';
  return{
    /* s は6文字の数字(例 "001234") */
    set(s){if(s===last)return;last=s;digs.forEach((d,i)=>{const on=MAP[s[i]]||'';Object.entries(d).forEach(([k,[q,b]])=>{q.style.opacity=on.includes(k)?b:0})})},
    colon(on){cols.forEach(g=>g.style.opacity=on?1:SEG.cOff)}
  };
}
const SG=seg7(document.getElementById('display'));SG.set('000000');SG.colon(true);

const role=new URLSearchParams(location.search).get('role');
document.body.className=role==='master'?'m':role==='cue'?'c':'s';
let off=null,T={running:false,base:0,value:0},CUE=null,lastBlink=-1,alive={},owner=null,ownerReady=false;
let anchor=null,syncing=false,lastSync=0;
const DBURL=db.app.options.databaseURL;
const can=()=>role==='master'&&ownerReady&&owner===did;
const now=()=>anchor?anchor.srv+(performance.now()-anchor.perf):Date.now()+off;
const secs=()=>T.running?Math.max(0,Math.floor((now()-T.base)/1000)):Math.floor(T.value);
const exact=()=>T.running?Math.min(359999,Math.max(0,Math.round((now()-T.base))/1000)):T.value;
function err(m){if(role!=='master')return;$('err').textContent=new Date().toTimeString().slice(0,8)+' '+m}
const bad=e=>err('ERR '+(e.code||e.message));
const setSt=(t,c)=>{$('status').textContent=t;$('status').className=c};
if(role!=='master')$('qrBtn').style.display='none';
if(role==='master'){const m=$('mon');m.appendChild($('err'));m.appendChild($('dbg'));m.appendChild($('status'))}

/* 接続と時計のずれ */
onValue(ref(db,'.info/connected'),s=>{if(s.val()){setSt('CONNECTED','ok');resync(true);if(role==='master'&&!ownerReady)setTimeout(()=>{ownerReady=true;ownerUi()},1500)}else setSt('UNLINK','ng')});
onValue(ref(db,'.info/serverTimeOffset'),s=>{off=s.val()});
/* タイマーとCUEの受信 */
onValue(R('timer'),s=>{const v=s.val()||{};T={running:!!v.running,base:v.base||0,value:v.value||0};ui();tick()},bad);
onValue(R('cue'),s=>{CUE=s.val()},bad);
/* 操作権 */
onValue(R('owner'),s=>{owner=s.val();ownerReady=true;if(role==='master'&&owner===null)set(R('owner'),did).catch(bad);ownerUi()},bad);
function ownerUi(){if(role!=='master')return;
  $('ctl').style.display=can()?'none':'flex';
  $('ctlText').textContent=ownerReady?'他の端末で操作中':'確認中…';
  $('ctlBtn').style.display=ownerReady?'block':'none'}
let lp=null;const fill=$('ctlFill');
const rel=()=>{clearTimeout(lp);fill.style.transition='none';fill.style.width='0'};
$('ctlBtn').onpointerdown=()=>{if(!ownerReady)return;fill.style.transition='width 1s linear';fill.style.width='100%';lp=setTimeout(()=>{set(R('owner'),did).catch(bad);rel()},1000)};
['onpointerup','onpointerleave','onpointercancel'].forEach(e=>$('ctlBtn')[e]=rel);
ownerUi();

/* 表示 */
function blink(){SG.colon(true);setTimeout(()=>SG.colon(false),500)}
function drawCue(t){
  const on=!!CUE&&CUE.target>t;
  if(role==='master'){
    $('cml').textContent=on?CUE.label:'--';$('cml').style.color=on?CUE.color:'#64748B';
    $('cmt').textContent=on?mmss(CUE.target):'--:--';$('cmt').style.color=on?'#CBD5E1':'#64748B';
    const mr=on?CUE.target-t:0;
    $('cmr').textContent=on?p2(Math.floor(mr/60))+':'+p2(mr%60):'--:--';$('cmr').style.color=on?CUE.color:'#64748B';
  }else if(role==='cue'){
    const r=on?CUE.target-t:0;
    $('cueLabel').textContent=on?CUE.label:'--';$('cueLabel').style.color=on?CUE.color:'#64748B';
    $('cueTargetTime').textContent=on?mmss(CUE.target):'--:--';$('cueTargetTime').style.color=on?'#e2e8f0':'#64748B';
    $('cueRemain').textContent=on?p2(Math.floor(r/60))+':'+p2(r%60):'--:--';$('cueRemain').style.color=on?CUE.color:'#64748B';
  }
}
function tick(){
  if(off===null&&!anchor)return;
  if(anchor&&Math.abs((Date.now()-anchor.date)-(performance.now()-anchor.perf))>700)resync();
  const t=Math.min(secs(),359999);
  const x=fmt(t).replace(/:/g,'');
  SG.set(x);
  if(t!==lastBlink){lastBlink=t;if(role!=='master'||T.running)blink()}
  if(can()&&CUE&&t>=CUE.target){CUE=null;set(R('cue'),null).catch(bad)}
  drawCue(t);
}
setInterval(tick,100);

/* 親機:操作 */
let buf='',saved='',editing=false,locked=false;
const wr=o=>set(R('timer'),o).catch(bad);
function ui(){if(role!=='master')return;q('.rz').classList.toggle('disabled',T.running);q('.set').classList.toggle('disabled',T.running)}
function preview(){const s=buf||saved;if(!s){$('inputPreview').textContent='--:--:--';return}const d=s.padStart(6,'0');$('inputPreview').textContent=d.slice(0,2)+':'+d.slice(2,4)+':'+d.slice(4,6)}
function press(n){if(!editing){buf='';editing=true}if(buf.length<6){buf+=n;preview()}}
addEventListener('keydown',e=>{
  if(role!=='master'||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
  const c=e.code;
  if($('qrOv').style.display==='flex'){if(c==='Escape')qrShow(0);return}
  let m=/^(?:Digit|Numpad)(\d)$/.exec(c);
  if(m){press(+m[1]);e.preventDefault();return}
  if(c==='Enter'||c==='NumpadEnter'){e.preventDefault();toggleTimer()}
  else if(c==='Escape'){e.preventDefault();clearInput()}
  else if(c==='KeyT'){e.preventDefault();setTimer()}
  else if(c==='KeyZ'){e.preventDefault();resetTimer()}
  else if(c==='Space')e.preventDefault()
});
function clearInput(){buf='';saved='';editing=false;preview()}
function setTimer(){if(!can()||T.running||!buf)return;wr({running:false,value:hms(buf),base:0});saved=buf;editing=false;preview()}
function resetTimer(){if(!can()||T.running)return;wr({running:false,value:0,base:0})}
function toggleTimer(){if(!can()||locked||(off===null&&!anchor))return;
  if(T.running)wr({running:false,value:exact(),base:0});
  else wr({running:true,base:now()-T.value*1000,value:T.value})}
function toggleLock(){locked=!locked;$('lock').textContent=locked?'🔒':'🔓';$('lock').style.background=locked?'#6B3F46':'';const g=q('.go');g.style.background=locked?'#334155':'#f8f8f4';g.style.color=locked?'#94a3b8':'#000'}
function cueTarget(){
  const t=secs();
  if(buf.length<=4){const d=buf.padStart(4,'0');let g=t-t%3600+d.slice(0,2)*60+d.slice(2,4)*1;if(g<=t)g+=3600;return g}
  return hms(buf)
}
function setCue(label,color){if(!can()||!buf)return;if(T.running&&off===null&&!anchor)return;set(R('cue'),{label,color,target:cueTarget()}).catch(bad)}
function clearCue(){if(!can())return;set(R('cue'),null).catch(bad)}
function qrShow(v){$('qrOv').style.display=v?'flex':'none'}
Object.assign(window,{press,clearInput,setTimer,resetTimer,toggleTimer,toggleLock,setCue,clearCue,qrShow,pinToggle});

/* 子機:TAP HERE を出す */
if(role!=='master')$('tap').style.display='flex';

/* 時計合わせ:サーバー時刻を3回測り、往復が一番速いものを採用。端末内部のストップウォッチで数える */
function showSync(r){$('sy').textContent=r<0?'SYNC SLOW':'SYNC '+Math.round(r)+'ms'}
async function resync(force){
  if(syncing||(!force&&performance.now()-lastSync<3000))return;
  syncing=true;
  try{
    let best=null;
    for(let i=0;i<3;i++){
      const c=new AbortController(),to=setTimeout(()=>c.abort(),4000);
      const t0=performance.now();
      const r=await fetch(DBURL+'/'+ROOM+'/ping/'+did+'.json',{method:'PUT',body:'{".sv":"timestamp"}',signal:c.signal});
      const S=await r.json();
      clearTimeout(to);
      const t1=performance.now(),d=Date.now();
      if(typeof S!=='number')throw new Error('bad');
      const rtt=t1-t0;
      if(!best||rtt<best.rtt)best={rtt,srv:S+rtt/2,perf:t1,date:d};
    }
    if(best.rtt<1500){anchor=best;showSync(best.rtt)}else showSync(-1);
  }catch(e){err('SYNC FAIL')}
  syncing=false;lastSync=performance.now();
}
setInterval(()=>{if(!anchor||performance.now()-lastSync>60000)resync()},5000);

/* 画面スリープ防止 */
let wl=null;
async function awake(){try{if('wakeLock' in navigator){if(!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}else $('wl').textContent='WL NONE'}catch(e){$('wl').textContent='WL '+e.name}}
$('tap').onclick=()=>{$('tap').style.display='none';awake()};
document.addEventListener('pointerdown',()=>{if(!wl)awake()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){awake();resync(true);if(role==='master'){ownerReady=false;ownerUi();goOffline(db);goOnline(db)}}});

/* PIN: 手前に出る小さな窓(パソコンの Chrome / Edge のみ) */
const PIN_W=300,PIN_H=170;
let pipHome=[],pipTimer=null,pipSync=null,pwl=null;
if(role==='cue'&&window.documentPictureInPicture)$('pinBtn').style.display='inline-block';
async function pipAwake(){
  if(!pipWin||pwl)return;
  const w=pipWin;
  try{
    const l=await w.navigator.wakeLock.request('screen');
    if(pipWin!==w){l.release().catch(()=>{});return}
    pwl=l;l.addEventListener('release',()=>{if(pwl===l)pwl=null})
  }catch(e){$('wl').textContent='WL(PIN) '+e.name}
}
function pipFit(){
  if(!pipWin||!pipBox)return;
  pipBox.style.transform='scale(1)';
  const r=pipBox.getBoundingClientRect();
  if(!r.width||!r.height)return;
  pipBox.style.transform='scale('+Math.min(pipWin.innerWidth*.96/r.width,pipWin.innerHeight*.96/r.height)+')';
}
function pipRestore(){
  if(!pipWin)return;
  const w=pipWin;pipWin=null;
  try{w.clearInterval(pipTimer);w.clearInterval(pipSync)}catch(e){}
  pipHome.forEach(([el,mark])=>{if(mark.parentNode)mark.parentNode.insertBefore(el,mark);mark.remove()});
  pipHome=[];pipBox=null;if(pwl){pwl.release().catch(()=>{});pwl=null}
  $('pinBtn').classList.remove('on');
  tick();
}
async function pinToggle(){
  if(pipWin){pipWin.close();return}
  if(!window.documentPictureInPicture)return;
  try{
    const w=await documentPictureInPicture.requestWindow({width:PIN_W,height:PIN_H});
    document.querySelectorAll('style,link[rel="stylesheet"]').forEach(n=>w.document.head.appendChild(n.cloneNode(true)));
    w.document.title='REAL TIME / TIMER';
    w.document.body.className='c pip';
    const box=w.document.createElement('div');
    box.className='container';
    box.style.cssText='width:max-content;flex:none;transform-origin:center';
    w.document.body.appendChild(box);
    ['display','slaveLabel','cueInfo'].forEach(id=>{
      const el=$(id),mark=document.createElement('span');
      mark.style.display='none';
      el.parentNode.insertBefore(mark,el);
      pipHome.push([el,mark]);
      box.appendChild(el);
    });
    pipWin=w;pipBox=box;
    $('pinBtn').classList.add('on');
    w.addEventListener('pagehide',pipRestore);
    w.addEventListener('resize',pipFit);
    pipTimer=w.setInterval(tick,100);
    pipSync=w.setInterval(()=>{if(!anchor||performance.now()-lastSync>60000)resync();pipAwake()},5000);
    pipAwake();
    pipFit();setTimeout(pipFit,100);
    if(w.document.fonts)w.document.fonts.ready.then(pipFit);
    try{w.moveTo((screen.availLeft||0)+16,(screen.availTop||0)+screen.availHeight-w.outerHeight-16)}catch(e){}
    tick();
  }catch(e){pipWin=null}
}

/* 画面の拡大縮小 */
const dg=$('dg'),box=q('.container');
function fit(){
  if(role==='master'){box.style.transform='scale(1)';const r=box.getBoundingClientRect();box.style.transform=`scale(${Math.min(innerWidth*.92/r.width,innerHeight*.92/r.height)})`}
  else if(role==='cue'){dg.style.transform='scale(1)';const r=dg.getBoundingClientRect();dg.style.transform=`scale(${Math.min(innerWidth*.88/r.width,innerHeight*.88/r.height)*.7})`}
  else{dg.style.transform='rotate(90deg) scale(1)';const r=dg.getBoundingClientRect();dg.style.transform=`rotate(90deg) scale(${Math.min(innerHeight*.88/r.width,innerWidth*.88/r.height)})`}
}
addEventListener('load',fit);/* 画面の向きが変わったら合わせ直す(CUE子機も。PINの小窓を出している間は小窓のほうで合わせる) */
addEventListener('resize',()=>{if(!pipWin)fit()});setTimeout(fit,100);
if(document.fonts)document.fonts.ready.then(fit);
</script>
